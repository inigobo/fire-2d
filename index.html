<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b090d" />
    <meta name="description" content="Fire 2D: an interactive WebGL fire and fluid experiment." />
    <title>Fire 2D — interactive experiment</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="fallback" aria-hidden="true"></div>
      <canvas id="fire" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="./" aria-label="Fire 2D home">FIRE<span> / </span>2D</a>
        <div class="top-links"><a class="source-link" href="./examples/scroll.html">Scroll test ↓</a><a class="source-link" href="https://github.com/inigobo/fire-2d" target="_blank" rel="noopener noreferrer">Source ↗</a></div>
      </header>

      <div class="hero-copy">
        <p class="eyebrow"><span class="live-dot"></span> An interactive fluid experiment</p>
        <h1>Give the<br /><em>fire</em> a little<br />air.</h1>
        <p class="intro"><span class="pointer-instruction">Move your pointer to stir the flame.</span><span class="touch-instruction">Touch to stir the flame.</span></p>
      </div>

      <aside class="controls" aria-label="Fire controls">
        <div class="controls-heading"><span>Shape the fire</span><span class="controls-index">01 / 11</span></div>
        <label class="preset-label"><span>Preset</span><select id="preset" aria-label="Fire preset"><option value="candle">Candle</option><option value="hearth" selected>Hearth</option><option value="bonfire">Bonfire</option><option value="custom" disabled>Custom</option></select></label>
        <label><span>Rise</span><input id="rise" type="range" min="0" max="100" value="55" /><output for="rise" id="rise-value">55</output></label>
        <label><span>Curl</span><input id="curl" type="range" min="0" max="100" value="42" /><output for="curl" id="curl-value">42</output></label>
        <label><span>Glow</span><input id="glow" type="range" min="0" max="100" value="64" /><output for="glow" id="glow-value">64</output></label>
        <label><span>Trail</span><input id="trail" type="range" min="0" max="100" value="58" /><output for="trail" id="trail-value">58</output></label>
        <label><span>Cooling</span><input id="cooling" type="range" min="0" max="100" value="40" /><output for="cooling" id="cooling-value">40</output></label>
        <label><span>Damping</span><input id="damping" type="range" min="0" max="100" value="10" /><output for="damping" id="damping-value">10</output></label>
        <label><span>Start pulses</span><input id="startupPulses" type="range" min="0" max="24" step="1" value="8" /><output for="startupPulses" id="startupPulses-value">8</output></label>
        <label><span>Burst seconds</span><input id="startupDuration" type="range" min="0" max="20" step="1" value="0" /><output for="startupDuration" id="startupDuration-value">0</output></label>
        <label><span>Burst strength</span><input id="startupStrength" type="range" min="0" max="4" step="0.1" value="1" /><output for="startupStrength" id="startupStrength-value">1</output></label>
        <label class="preset-label"><span>Opening</span><select id="startupPattern"><option value="scatter">Scattered pulses</option><option value="serpentine">Left-to-right wave</option><option value="swirls">Random curved trails</option></select></label>
        <button type="button" id="pulse-burst" class="motion-toggle">Replay pulses <span aria-hidden="true">↻</span></button>
        <button type="button" id="motion-toggle" class="motion-toggle">Pause motion <span aria-hidden="true">Ⅱ</span></button>
      </aside>

      <footer class="footer"><span>WEBGL2 / REAL-TIME</span><span id="status" role="status">Loading the fire…</span></footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
